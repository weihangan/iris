<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>Chat6 Desktop Avatar</title>
  <style>
    /* 全局重置，消除所有默认边框/阴影/间距 */
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      border: none;
      outline: none;
      box-shadow: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      background: transparent !important;
      overflow: hidden;
    }
    #canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
      background: transparent;
    }
    .status-label {
      position: fixed;
      bottom: 4px;
      left: 4px;
      font-size: 10px;
      color: rgba(200, 200, 200, 0.5);
      font-family: monospace;
      pointer-events: none;
      /* Phase 5.2B.1 Task 5：默认隐藏，仅在显式 debug 模式下显示。
         生产视角截图不得包含 [PMX rendered: 156 morphs] 等 debug 文本。 */
      display: none;
    }
    .status-label.debug-visible {
      display: block;
    }
    /* ===== Morph Panel（Phase 3 Task 3.3） ===== */
    .mp-panel {
      position: fixed;
      right: 8px;
      bottom: 8px;
      width: 220px;
      padding: 8px 10px;
      background: rgba(20, 20, 28, 0.78);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 6px;
      color: #e6e6e6;
      font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
      font-size: 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(4px);
      z-index: 1000;
      user-select: none;
    }
    .mp-title {
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
      padding-bottom: 4px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      color: #f0f0f0;
    }
    .mp-section {
      margin-top: 6px;
      margin-bottom: 3px;
      font-size: 11px;
      color: #a0a0a0;
      letter-spacing: 0.3px;
    }
    .mp-row {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-bottom: 4px;
    }
    .mp-btn {
      padding: 3px 8px;
      background: rgba(60, 60, 72, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 3px;
      color: #e0e0e0;
      font-size: 11px;
      cursor: pointer;
      transition: background 0.12s, border-color 0.12s;
    }
    .mp-btn:hover {
      background: rgba(80, 80, 96, 0.95);
      border-color: rgba(255, 255, 255, 0.3);
    }
    .mp-btn-toggle.active {
      background: rgba(96, 160, 220, 0.85);
      border-color: rgba(140, 200, 255, 0.6);
      color: #ffffff;
    }
    .mp-btn-reset {
      display: block;
      width: 100%;
      margin-top: 8px;
      padding: 4px 0;
      background: rgba(120, 60, 60, 0.7);
      border-color: rgba(220, 120, 120, 0.5);
      text-align: center;
    }
    .mp-btn-reset:hover {
      background: rgba(160, 80, 80, 0.85);
    }
    .mp-slider-container {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 4px;
    }
    .mp-slider {
      flex: 1;
      cursor: pointer;
    }
    .mp-slider-value {
      min-width: 32px;
      text-align: right;
      font-family: monospace;
      font-size: 11px;
      color: #c0c0c0;
    }
    /* ===== Phase 3 Step 5：Physics Status UI ===== */
    .mp-physics-section {
      margin-top: 8px;
      padding-top: 6px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }
    .mp-physics-status-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 4px;
    }
    .mp-physics-status {
      font-size: 11px;
      font-weight: 500;
      padding: 2px 6px;
      border-radius: 3px;
    }
    .mp-physics-unavailable {
      color: #ff9a9a;
      background: rgba(180, 60, 60, 0.35);
      border: 1px solid rgba(220, 120, 120, 0.5);
    }
    .mp-physics-available {
      color: #9aff9a;
      background: rgba(60, 180, 60, 0.35);
      border: 1px solid rgba(120, 220, 120, 0.5);
    }
    .mp-physics-toggle {
      display: block;
      width: 100%;
      padding: 4px 0;
      font-size: 11px;
    }
    .mp-btn-disabled {
      opacity: 0.5;
      cursor: not-allowed;
      background: rgba(60, 60, 72, 0.5);
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div class="status-label" id="status-label">[Loading PMX...]</div>
  <script type="module" src="./desktop-avatar-renderer.ts"></script>
</body>
</html>
